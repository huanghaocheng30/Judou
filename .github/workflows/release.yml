# 句读发布工作流（M7 D5 / AC5）
#
# 位置说明（同 ci.yml）：E-M7-2 已搬到**仓库根** .github/workflows/release.yml，
# 内容未改（各步本就用 working-directory / projectPath 相对仓库根指向 02-代码）。
#
# 触发：workflow_dispatch（人工发版）+ push tag `v*`
# 产物：Windows NSIS 安装包 → 上传为 **草稿 Release**（人工确认后再发布）
# 私钥：只引用 secrets.* 名称；仓库内不留密钥文件（.gitignore 覆盖 *.key / *.pem / tauri-signing*）
#
# 更新清单（latest.json）分两条路：
#   - 本工作流：`JUDOU_UPDATER_ENABLED` 仓库变量为 true 时才跑 make-update-manifest.mjs
#     （未配置签名密钥时该脚本会明确报错退出，所以默认不跑，避免发版被卡住）
#   - 本地/手动发版：scripts/build-installer.ps1 打包 → make-update-manifest.mjs 生成清单

name: release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 是否发为草稿 Release
        type: boolean
        default: true
  push:
    tags:
      - "v*"

jobs:
  release:
    name: release (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 02-代码
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 02-代码/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 02-代码/src-tauri -> target

      - name: npm ci
        run: npm ci

      # 发布前先过门禁：版本三处一致 / 工作流自检 / .gitignore 覆盖私钥 / 回归
      - name: Release gates
        run: |
          npm run verify:release
          npm run verify:invoke
          npm run verify:records
          npm run build

      - name: Build NSIS installer and upload draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: 02-代码
          args: --bundles nsis
          tagName: v__VERSION__
          releaseName: 句读 v__VERSION__
          releaseDraft: true

      - name: Generate latest.json manifest
        if: ${{ vars.JUDOU_UPDATER_ENABLED == 'true' }}
        run: node scripts/make-update-manifest.mjs

      - name: Upload latest.json to Release
        if: ${{ vars.JUDOU_UPDATER_ENABLED == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifest = "src-tauri/target/release/bundle/latest.json"
          if (-not (Test-Path $manifest)) { throw "未生成 $manifest" }
          gh release upload "v$(node -p "require('./src-tauri/tauri.conf.json').version")" $manifest --clobber
