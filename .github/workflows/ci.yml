# 句读 CI 骨架（M0）
#
# 位置说明（E-M7-2 已落地）：GitHub Actions 只认**仓库根** .github/workflows/，
# 而本任务包的目标代码区是 02-代码/。本文件现位于仓库根 .github/workflows/ci.yml，
# `defaults.run.working-directory` 与各缓存路径都是「相对仓库根」指向 02-代码/，内容无需改动。
#
# 三平台依据：01 §三 第 7 条 + 05 §十六.4；Android job 以 if: false 占位，M7 启用。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: 02-代码
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 02-代码/package-lock.json

      - name: Install Linux dependencies (Tauri 官方清单)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 02-代码/src-tauri -> target

      - name: npm ci
        run: npm ci

      - name: Build frontend (tsc + vite)
        run: npm run build

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --bins

      # M7 · 发布链路门禁：版本三处一致 + workflow 自检 + .gitignore 覆盖私钥 + 回归
      # （DB/二进制类门禁 verify:import-user / verify:ai-import 需本机 Rust bin 与临时库，不在 CI 跑）
      - name: Release and regression gates
        run: |
          npm run verify:release
          npm run verify:ci
          npm run verify:invoke
          npm run verify:records

  android:
    # M7 启用：需 Android SDK/NDK 与签名密钥，M0 只占位不跑
    name: android (M7 启用)
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Android 打包在 M7 接入（SDK/NDK/签名密钥见 04 §10.5）"
