name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 门禁：纯 Node 脚本，秒级，无编译 ────────────────────────
  gates:
    name: 质量门禁（Node）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-代码
    steps:
      - uses: actions/checkout@v4

      # 必须 Node 22+：verify-sql / note / note-marks / vocab / review / render / analysis / tables
      # 使用 node:sqlite（Node 22 起内置，24 稳定）。Node 20 会直接崩。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 02-代码/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # 16 项跨平台门禁（verify:pack 单独一步，见下）
      - name: verify:invoke
        run: npm run verify:invoke --silent
      - name: verify:sql
        run: npm run verify:sql --silent
      - name: verify:contrast
        run: npm run verify:contrast --silent
      - name: verify:ci
        run: npm run verify:ci --silent
      - name: verify:render
        run: npm run verify:render --silent
      - name: verify:analysis
        run: npm run verify:analysis --silent
      - name: verify:note
        run: npm run verify:note --silent
      - name: verify:note-marks
        run: npm run verify:note-marks --silent
      - name: verify:vocab
        run: npm run verify:vocab --silent
      - name: verify:review
        run: npm run verify:review --silent
      - name: verify:records
        run: npm run verify:records --silent
      - name: verify:release
        run: npm run verify:release --silent
      - name: verify:pending
        run: npm run verify:pending --silent
      - name: verify:android
        run: npm run verify:android --silent
      - name: verify:tables
        run: npm run verify:tables --silent
      - name: verify:icons
        run: npm run verify:icons --silent
      - name: test:theme
        run: npm run test:theme --silent

      # verify:pack 有一条「Android .so 内嵌内容包特征串」的检查，
      # 依赖本地 aarch64 构建产物（CI 上不存在）。故用 continue-on-error，
      # 其余 72/73 文件 SHA-256 与 manifest 一致性仍然真校验。
      - name: verify:pack（含 Android 产物检查，CI 上可能跳过）
        run: npm run verify:pack --silent
        continue-on-error: true

      - name: 前端构建（tsc + vite）
        run: npm run build

  # ── Rust 测试：需要编译，较慢 ──────────────────────────────
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-代码/src-tauri
    steps:
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上编译需要的系统库
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 02-代码/src-tauri

      - name: cargo test
        run: cargo test --lib --bins 2>&1 | tail -40
