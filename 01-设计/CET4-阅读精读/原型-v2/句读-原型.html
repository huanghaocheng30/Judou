<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>句读 Judou · 原型 v2</title>
<style>
:root{
  --paper:#FAF8F4; --paper-2:#F3EFE7; --paper-3:#EDE7DB;
  --ink:#1F1D1A; --ink-2:#5C554A; --ink-3:#8C8477;
  --line:#E2DCCF; --line-2:#CFC7B6;
  --blue:#2F5D8A; --blue-soft:#E6EDF5;
  --rose:#A63A5B; --rose-soft:#F7E8EC;
  --green:#3F7A5A; --green-soft:#E6F0E9;
  --accent:#B4622F; --accent-soft:#F6E9DE;
  --shadow:0 1px 2px rgba(31,29,26,.05), 0 8px 24px -12px rgba(31,29,26,.18);
  --serif:"Source Serif 4", Georgia, "Times New Roman", "Songti SC", serif;
  --sans:-apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  --mono:"Cascadia Code", Consolas, monospace;
}
[data-theme="dark"] .mk.subj{color:#9CC0EA;background:rgba(96,148,210,.20)}
[data-theme="dark"] .mk.pred{color:#9CC0EA;border-bottom-color:#9CC0EA}
[data-theme="dark"] .mk.obj{text-decoration-color:rgba(224,140,164,.9)}
[data-theme="dark"] .mk.clause{border-left-color:#4E4E5C}
[data-theme="dark"] .ac-sec p,[data-theme="dark"] .ac-sec li,[data-theme="dark"] .legend li{color:#B6AFA5}
[data-theme="dark"] .phr em,[data-theme="dark"] .muted{color:#948C82}
[data-theme="dark"]{
  --paper:#14141A; --paper-2:#1B1B22; --paper-3:#23232C;
  --ink:#E9E4DA; --ink-2:#A9A29A; --ink-3:#7A746C;
  --line:#2C2C36; --line-2:#3A3A46;
  --blue:#7FA9D4; --blue-soft:#1C2632;
  --rose:#D77A94; --rose-soft:#2A1D22;
  --green:#7FB795; --green-soft:#1B2A22;
  --accent:#D08A5A; --accent-soft:#2A211A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}

/* 壳 */
.shell{display:flex;min-height:100vh}
.side{width:210px;flex:none;background:var(--paper-2);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .mark{width:27px;height:27px;flex:none;display:block}
.brand .mark .ln{fill:var(--ink)}
.brand .mark .hl{fill:var(--accent)}
.brand .mark .dot{fill:var(--accent)}
.brand b{font-family:var(--serif);font-size:21px;letter-spacing:.06em;display:block;line-height:1.1}
.brand .latin{font-size:9px;letter-spacing:.3em;color:var(--ink-3);text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--ink-2);font-size:13.5px;margin-bottom:1px}
.nav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.nav:hover{background:var(--paper-3);color:var(--ink)}
.nav.on{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.nav .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:99px;line-height:1.5}
.side-foot{margin-top:auto;padding:10px;display:flex;gap:6px;align-items:center}
.theme-btn{font-size:12px;color:var(--ink-3);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.theme-btn.on{color:var(--ink);border-color:var(--line-2);background:var(--paper)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:blur(8px);z-index:5}
.back{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--line);border-radius:7px;color:var(--ink-2);font-size:16px}
.back:hover{background:var(--paper-2);color:var(--ink)}
.topbar h1{font-family:var(--serif);font-size:16.5px;margin:0;font-weight:600;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .meta{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tag{font-size:11px;padding:1.5px 7px;border-radius:99px;background:var(--blue-soft);color:var(--blue);font-weight:600;white-space:nowrap}
.tag.plain{background:var(--paper-3);color:var(--ink-2);font-weight:500}

/* 正文 + 旁批 */
.read{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:0;flex:1;min-height:0}
.article{padding:34px 44px 120px;max-width:660px;margin:0 auto;width:100%}
.article .h{font-family:var(--serif);font-size:27px;line-height:1.3;margin:0 0 10px;letter-spacing:-.01em}
.article .sub{color:var(--ink-3);font-size:12.5px;margin-bottom:26px}
.para{font-family:var(--serif);font-size:18px;line-height:2;margin:0 0 22px;color:var(--ink)}
.s{cursor:pointer;border-radius:3px;transition:background .12s}
.s:hover{background:color-mix(in srgb, var(--blue) 8%, transparent)}
.s.cur{background:color-mix(in srgb, var(--blue) 5%, transparent);border-radius:2px}
.w{cursor:pointer;border-radius:2px;padding:0 .5px}
.w:hover{background:color-mix(in srgb, var(--accent) 16%, transparent);text-decoration:underline;text-underline-offset:3px}
.w.has-an{border-bottom:1px dotted color-mix(in srgb, var(--accent) 55%, transparent)}
.w.sel{background:color-mix(in srgb, var(--accent) 18%, transparent);border-bottom:1px solid var(--accent);border-radius:2px}
.blank{display:inline-block;min-width:26px;text-align:center;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--rose);background:var(--rose-soft);border:1px dashed color-mix(in srgb, var(--rose) 45%, transparent);border-radius:5px;padding:0 5px;margin:0 1px;cursor:pointer;vertical-align:1px}
.qwrap{margin-top:34px;border-top:1px solid var(--line);padding-top:20px}
.qwrap summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:8px}
.qwrap summary::-webkit-details-marker{display:none}
.qwrap summary::before{content:"▸";font-size:11px;color:var(--ink-3)}
.qwrap[open] summary::before{content:"▾"}
.q{margin:16px 0;padding:14px 16px;border:1px solid var(--line);border-radius:9px;background:var(--paper-2)}
.q-stem{font-size:13.5px;margin-bottom:8px}
.q-opts{display:grid;gap:4px}
.opt{display:flex;gap:8px;font-size:13px;color:var(--ink-2);padding:2px 0}
.opt i{font-style:normal;font-weight:600;color:var(--ink-3);min-width:12px}
.q-ans{margin-top:8px;font-size:12.5px;color:var(--green);font-weight:600}
.q-ans[hidden]{display:none}
.q-tools{margin-top:8px}
.link{font-size:12.5px;color:var(--blue);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.aside{border-left:1px solid var(--line);background:var(--paper-2);overflow-y:auto;max-height:calc(100vh - 57px);position:sticky;top:57px}
.ac{padding:20px 22px 80px}
.ac-empty{padding:40px 20px 28px}
.ac-empty h5{font-family:var(--serif);font-size:15.5px;margin:0 0 18px;color:var(--ink);font-weight:600;text-align:center}
.ac-empty ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px}
.ac-empty li{font-size:12.5px;line-height:1.7;color:var(--ink-2);padding-left:11px;border-left:2px solid var(--line-2)}
.ac-empty li b{display:block;color:var(--ink);font-size:12.5px;margin-bottom:2px;font-weight:600}
.ac-kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.ac-quote{font-family:var(--serif);font-size:14.5px;line-height:1.75;color:var(--ink-2);margin:0 0 4px;padding-left:10px;border-left:2px solid var(--line-2)}
.ac-sec{padding:14px 0;border-top:1px solid var(--line)}
.ac-sec:first-of-type{border-top:none}
.ac-sec h4{font-size:11.5px;font-weight:600;color:var(--ink-3);margin:0 0 8px;letter-spacing:.06em}
.ac-sec p{margin:0 0 6px;font-size:13px;line-height:1.75}
.ac-sec .lit{color:var(--ink-2)}
.ac-sec .nat{color:var(--ink);font-weight:500}
.ac-sec .sum{color:var(--ink-2);font-size:12.5px;margin-top:10px}
.ac-sec ul{margin:0;padding-left:16px;font-size:13px;line-height:1.8}
.ac-sec li{margin:2px 0}
.phr{list-style:none;padding:0!important}
.phr li{display:flex;gap:8px;align-items:baseline;padding:3px 0}
.phr b{font-family:var(--serif);font-size:13.5px;color:var(--blue);font-weight:600;white-space:nowrap}
.phr span{color:var(--ink-2);font-size:12.5px}
.phr em{display:block;font-style:normal;color:var(--ink-3);font-size:11.5px;line-height:1.6;margin-top:2px}
.pit li{color:var(--ink-2)}
.mk-line{font-family:var(--serif);font-size:15px;line-height:2.25;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 13px}
.mk{white-space:pre-wrap}
.mk.subj{color:var(--blue);background:color-mix(in srgb, var(--blue) 16%, transparent);border-radius:2px;padding:0 2px}
.mk.pred{color:var(--blue);border-bottom:1.5px solid var(--blue);padding:0 1px}
.mk.obj{color:var(--ink);text-decoration:underline dashed color-mix(in srgb,var(--rose) 60%,transparent);text-decoration-thickness:1px;text-underline-offset:5px}
.mk.clause{border-left:2px solid var(--line-2);padding-left:2px;color:var(--ink)}
.mk.phrase{color:var(--ink-2);border-bottom:1px dashed var(--line-2)}
.legend{list-style:none;padding:0!important;display:flex;flex-wrap:wrap;gap:6px;margin-top:12px!important}
.legend li{font-size:10.5px;padding:0}
.legend .mk{font-size:10.5px;padding:1px 5px!important;border:1px solid var(--line);border-radius:3px}
.wc-word{font-family:var(--serif);font-size:25px;display:flex;align-items:baseline;gap:10px}
.wc-ph{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.wc-pos{font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:0 4px}
.wc-src{font-size:11px;color:var(--ink-3);margin:12px 0 2px;letter-spacing:.04em}
.wc-sense{font-size:14px;line-height:1.8;margin:0}
.wc-actions{display:flex;gap:8px;margin-top:16px}
.btn{font-size:12.5px;padding:6px 13px;border-radius:7px;border:1px solid var(--line-2);color:var(--ink-2);background:var(--paper)}
.btn:hover{color:var(--ink);border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary.done{background:var(--green);border-color:var(--green)}
code{font-family:var(--mono);font-size:12px;background:var(--paper-3);padding:1px 5px;border-radius:4px;color:var(--ink-2)}
.muted{color:var(--ink-3)}
details summary{cursor:pointer;font-size:12.5px;color:var(--blue)}

/* 通用页面 */
.page{padding:30px 28px 90px;max-width:1180px;width:100%;margin:0 auto}
.page-h{display:flex;align-items:baseline;gap:12px;margin:0 0 6px}
.page-h h2{font-family:var(--serif);font-size:22px;margin:0;font-weight:600}
.page-sub{color:var(--ink-3);font-size:12.5px;margin:0 0 22px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:7px 12px;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
select,.inp{font:inherit;font-size:12.5px;padding:5px 24px 5px 9px;border:1px solid var(--line-2);border-radius:7px;background:var(--paper);color:var(--ink-2);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{display:flex;flex-direction:column;padding:15px 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);min-height:104px}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.card-title{font-family:var(--serif);font-size:15.5px;line-height:1.4;margin-bottom:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-3);margin-top:auto}
.empty{border:1px dashed var(--line-2);border-radius:10px;padding:26px;text-align:center;color:var(--ink-3);font-size:13px;line-height:2}
.empty .btn{margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:baseline}
.vw{font-family:var(--serif);font-size:15px}
.vw .ph{display:block;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.vs{color:var(--ink-2);font-size:12.5px}
.va{color:var(--ink-3);font-size:12px}
.chip{font-size:11px;padding:1.5px 7px;border-radius:99px;background:var(--paper-3);color:var(--ink-2);white-space:nowrap}
.chip.b{background:var(--blue-soft);color:var(--blue)}
.stat-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:26px}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.stat b{display:block;font-family:var(--serif);font-size:26px;line-height:1.1}
.stat span{font-size:11.5px;color:var(--ink-3)}
.row{display:flex;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px;max-width:620px}
label.f{display:block;font-size:12px;color:var(--ink-2);margin-bottom:6px}
textarea.inp, input.inp{width:100%;padding:10px 12px;border-radius:8px;background:var(--paper);color:var(--ink);min-height:auto}
textarea.inp{min-height:160px;line-height:1.7;font-family:var(--mono);font-size:12.5px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv span{color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{padding:5px 12px;font-size:12.5px;color:var(--ink-2)}
.seg button.on{background:var(--paper-3);color:var(--ink);font-weight:600}
.hint{font-size:12px;color:var(--ink-3);line-height:1.8}
@media (max-width:1100px){
  .read{grid-template-columns:1fr}
  .aside{position:fixed;left:210px;right:0;bottom:0;top:auto;max-height:55vh;border-left:none;border-top:1px solid var(--line-2);border-radius:14px 14px 0 0;box-shadow:0 -12px 40px -12px rgba(0,0,0,.28);z-index:20;display:none}
  .aside.open{display:block}
  .article{padding:26px 24px 120px}
}
@media (max-width:720px){
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;width:auto;flex-direction:row;padding:6px;border-right:none;border-top:1px solid var(--line);z-index:30;overflow-x:auto}
  .brand,.side-foot{display:none}
  .nav{flex-direction:column;gap:2px;font-size:10px;padding:6px 10px;min-width:56px;text-align:center}
  .nav .badge{position:absolute;transform:translate(14px,-6px)}
  .aside{left:0}
  .topbar{padding:10px 14px}
  .page{padding:20px 14px 90px}
  .article .h{font-size:22px}
  .para{font-size:17px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#/today"><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><rect class="ln" x="14" y="18" width="62" height="11" rx="5.5"/><rect class="ln" x="14" y="37" width="40" height="11" rx="5.5"/><rect class="hl" x="14" y="56" width="44" height="11" rx="5.5"/><rect class="ln" x="14" y="75" width="40" height="11" rx="5.5"/><circle class="dot" cx="84" cy="61.5" r="7"/></svg><span><b>句读</b><span class="latin">Judou</span></span></a>
    
  <a class="nav" href="#/today" data-nav="today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h10M4 19h7"/></svg>
    <span>今日</span>
  </a>
    
  <a class="nav" href="#/library" data-nav="library">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h9l5 5v11H5z"/><path d="M14 4v5h5"/></svg>
    <span>文章库</span>
  </a>
    
  <a class="nav" href="#/review" data-nav="review">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg>
    <span>复习</span><b class="badge">2</b>
  </a>
    
  <a class="nav" href="#/vocab" data-nav="vocab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h9a3 3 0 0 1 3 3v13H9a3 3 0 0 1-3-3z"/><path d="M18 20H9"/></svg>
    <span>生词本</span>
  </a>
    
  <a class="nav" href="#/import" data-nav="import">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><path d="M4 18h16"/></svg>
    <span>导入</span>
  </a>
    
  <a class="nav" href="#/records" data-nav="records">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V9M12 20V4M19 20v-7"/></svg>
    <span>记录</span>
  </a>
    
  <a class="nav" href="#/settings" data-nav="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
    <span>设置</span>
  </a>
    <div class="side-foot">
      <button class="theme-btn" data-theme="light">浅</button>
      <button class="theme-btn" data-theme="dark">深</button>
      <button class="theme-btn on" data-theme="system">跟随</button>
    </div>
  </aside>
  <div class="main" id="main"></div>
</div>

e probably a big deal~.","structureSummary":"两个并列分句：①主系表（表语为 why 从句）；②there be 存在句 + 同位语从句","components":[{"part":"That","role":"主语","note":"指代上一段的结论"},{"part":"'s (= is)","role":"系动词","note":"主系结构"},{"part":"why we feel like we have to appear busy","role":"表语从句","note":"That's why... 是“这就是为什么……”"},{"part":"there","role":"引导词","note":"第二分句的 there be 存在句"},{"part":"a real perception","role":"主语（实义主语）","note":"真正被陈述的对象：一种真实的看法"},{"part":"that if someone is..., then they're probably a big deal","role":"同位语从句","note":"说明 perception 的具体内容"}],"clauses":["why we feel like we have to appear busy 是 why 引导的表语从句（That's why + 结果）。","feel like 在口语中可直接接句子，表示“感觉好像……”。","that if someone is..., then they're... 是 that 引导的同位语从句，解释 perception 的内容，不是定语从句。","同位语从句内部又套了一层 if 引导的条件状语从句 + then 引导的主句。"],"phrases":[{"text":"feel like + 句子","meaning":"感觉好像……","usage":"口语结构；也可接名词/动名词（feel like a coffee 想喝杯咖啡）。","example":"I feel like I've been running all day. 我感觉自己一整天都在跑。"},{"text":"knee-deep in","meaning":"深陷于、忙于（字面：深到膝盖）","usage":"形象化表达，常搭工作/麻烦：knee-deep in debt 债台高筑。","example":"She's knee-deep in paperwork. 她深陷文书工作之中。"},{"text":"a big deal","meaning":"大人物；了不起的事（口语）","usage":"否定式 no big deal 意为“没什么大不了”；形容人是“人物、大咖”。","example":"He acts like he's a big deal. 他表现得自己是个大人物似的。"}],"pitfalls":["That's why... 表结果，That's because... 表原因，两者常被混用。","there's a perception that... 里 that 引导同位语从句，不能用 which 替换。","a big deal 是口语习语，不能按字面译成“一笔大交易”。"],"paragraphRole":"把研究结论落到日常行为：解释我们为什么要“装忙”，并点出这种看法是被普遍相信的。"}},{"idx":1,"text":"This culture of busyness is making it hard for employees to find work-life balance.","tokens":[{"s":"This","n":"this","w":true,"a":0,"e":4,"an":null},{"s":"culture","n":"culture","w":true,"a":5,"e":12,"an":{"phonetic":"/ˈkʌltʃə(r)/","pos":"n.","senseInContext":"文化、风气（this culture of busyness 这种忙碌文化）","collocations":["company culture","a culture of...","cultural difference"],"examples":["The company has a culture of long hours. 这家公司有加班文化。"],"isCet4HighFreq":true,"more":{"roots":"cult（耕作）+ - 的名词形式，意为“忙碌的状态”"},{"part":"is making","role":"谓语","note":"现在进行时，强调正在发生"},{"part":"it","role":"形式宾语","note":"占位，真正的宾语是后面的不定式"},{"part":"hard","role":"宾语补足语","note":"说明 it 的状态：难"},{"part":"for employees","role":"不定式的逻辑主语","note":"说明“对谁来说难”"},{"part":"to find work-life balance","role":"真正宾语","note":"被 it 替代的后置宾语"}],"clauses":["本句是简单句，没有从句。","make it hard for sb. to do sth. 是固定句型：it 作形式宾语，形容词作宾补，不定式作真正宾语。"],"phrases":[{"text":"make it hard for sb. to do sth.","meaning":"使某人难以做某事","usage":"同族句型：make it easy/possible/necessary for sb. to do。","example":"Noise makes it hard for me to focus. 噪音让我很难集中注意力。"},{"text":"work-life balance","meaning":"工作与生活的平衡","usage":"固定复合名词，中间用连字符；常搭 find / maintain / achieve。","example":"Remote work can improve work-life balance. 远程办公能改善工作与生活的平衡。"}],"pitfalls":["it 是形式宾语，不能换成 this 或 that。","hard 是宾语补足语，不要写成 hardly（几乎不），意思完全不同。","busyness 与 business 拼写接近但意思不同：前者“忙碌”，后者“生意”。"],"paragraphRole":"指出忙碌文化的第一个后果：挤压工作与生活的平衡。"}},{"idx":2,"text":"According to a recent study, one in five highly engaged employees is at risk of burnout.","tokens":[{"s":"According","n":"according","w":true,"a":0,"e":9,"an":null},{"s":"to","n":"to","w":true,"a":10,"e":12,"an":null},{"s":"a","n":"a","w":true,"a":13,"e":14,"an":null},{"s":"recent","n":"recent","w":true,"a":15,"e":21,"an":null},{"s":"study","n":"study","w":true,"a":22,"e":27,"an":null},{"s":",","n":null,"w":false,"a":27,"e":28,"an":null},{"s":"one","n":"one","w":true,"a":29,"e":32,"an":null},{"s":"in","n":"in","w":true,"a":33,"e":35,"an":null},{"s":"five","n":"five","w":true,"a":36,"e":40,"an":null},{"s":"highly","n":"highly","w":true,"a":41,"e":47,"an":null},{"s":"engaged","n":"engaged","w":true,"a":48,"e":55,"an":{"phonetic":"/ɪnˈɡeɪdʒd/","pos":"adj.","senseInContext":"投入的、敬业的（highly engaged employees 高度投入的员工）","collocations":["be engaged in","highly engaged","be engaged to sb."],"examples":["Engaged employees stay longer. 投入度高的员工留得更久。"],"isCet4HighFreq":true,"more":{"roots":"en-（使）+ gage（抵押/承诺）→ 作出承诺 → 投入","s ey, most students sleep late. 调查显示，多数学生睡得晚。"},{"text":"one in five","meaning":"五分之一","usage":"作主语时谓语用单数；同义：one out of five。","example":"One in five adults has tried it. 五分之一的成年人试过。"},{"text":"at risk of","meaning":"有……的风险","usage":"后接名词或动名词：at risk of failing；也可说 be at risk（处于危险中）。","example":"Smokers are at risk of lung cancer. 吸烟者有患肺癌的风险。"}],"pitfalls":["one in five... 作主语时谓语用单数 is，不能用 are。","according to 后面不能接 that 从句，这是常见错误。","burnout 是“职业倦怠”，burn out 是动词短语“烧尽、耗尽”。"],"paragraphRole":"用一项研究数据坐实“忙碌文化有害”，把议论从现象推进到代价。"}}]},{"idx":3,"sentences":[{"idx":0,"text":"Personally, I'm going to stop saying \"busy\" when people ask me how I am.","tokens":[{"s":"Personally","n":"personally","w":true,"a":0,"e":10,"an":null},{"s":",","n":null,"w":false,"a":10,"e":11,"an":null},{"s":"I'm","n":"i'm","w":true,"a":12,"e":15,"an":null},{"s":"going","n":"going","w":true,"a":16,"e":21,"an":null},{"s":"to","n":"to","w":true,"a":22,"e":24,"an":null},{"s":"stop","n":"stop","w":true,"a":25,"e":29,"an":null},{"s":"saying","n":"saying","w":true,"a":30,"e":36,"an":null},{"s":"\"","n":null,"w":false,"a":37,"e":38,"an":null},{"s":"busy","n":"busy","w":true,"a":38,"e":42,"an":null},{"s":"\"","n":null,"w":false,"a":42,"e":43,"an":null},{"s":"when","n":"when","w":true,"a":44,"e":48,"an":null},{"s":"people","n":"people","w":true,"a":49,"e":55,"an":null},{"s":"ask","n":"ask","w":true,"a":56,"e":59,"an":null},{"s":"me","n":"me","w":true,"a":60,"e":62,"an":null},{"s":"how","n":"how","w":true,"a":63,"e":66,"an":null},{"s":"I","n":"i","w":true,"a":67,"e":68,"an":null},{"s":"am","n":"am","w":true,"a":69,"e":71,"an":null},{"s":".","n":null,"w":false,"a":71,"e":72,"an":null}],"an":{"translationLiteral":"就我个人而言，我打算停止在人们问我怎么样时说“忙”。","translationNatural":"就我自己来说，别人问我近况，我不打算再答“忙”了。","structMarkup":"(Personally), 【I】 _'m going to stop saying_ ~\"busy\"~ {when people ask me how I am}.","structureSummary":"主谓宾结构 + 时间状语从句（be going to 表打算）","components":[{"part":"Personally","role":"插入语","note":"表示“就我个人而言”，修饰整句"},{"part":"I","role":"主语","note":"作者自己"},{"part":"'m going to stop saying","role":"谓语","note":"be going to 表主观打算；stop doing 表“停止做”"},{"part":"\"busy\"","role":"宾语","note":"saying 的宾语，指说“忙”这个词"},{"part":"when people ask me how I am","role":"时间状语从句","note":"交代说这句话的场合"}],"clauses":["when people ask me how I am 是 when 引导的时间状语从句。","从句内部 how I am 是 how 引导的宾语从句，作 ask 的直接宾语，用陈述语序（不是 how am I）。","stop saying 中 saying 是动名词，作 stop 的宾语。"],"phrases":[{"text":"be going to do sth.","meaning":"打算、将要（做某事）","usage":"表主观计划或已有迹象的预测，比 will 更能体现“决定”。","example":"I'm going to start running next week. 我打算下周开始跑步。"},{"text":"stop doing sth.","meaning":"停止做某事（不再做）","usage":"对比 stop to do sth.＝停下来去做另一件事，两者意思差别很大。","example":"He stopped smoking last year. 他去年戒烟了。"}],"pitfalls":["stop saying 是“不再说”；stop to say 是“停下来去说”，别混。","how I am 是宾语从句，必须用陈述语序。","saying 后接的是词本身（\"busy\"），带引号，不要理解成形容词 busy。"],"paragraphRole":"从议论转向行动：作者宣布自己不再用“忙”作答，开启下文的做法与呼吁。"}},{"idx":1,"text":"It sounds self-righteous and sets the wrong tone.","tokens":[{"s":"It","n":"it","w":true,"a":0,"e":2,"an":null},{"s":"sounds","n":"sounds","w":true,"a":3,"e":9,"an":null},{"s":"self-righteous","n":"self-righteous","w":true,"a":10,"e":24,"an":null},{"s":"and","n":"and","w":true,"a":25,"e":28,"an":null},{"s":"sets","n":"sets","w":true,"a":29,"e":33,"an":null},{"s":"the","n":"the","w":true,"a":34,"e":37,"an":null},{"s":"wrong","n":"wrong","w":true,"a":38,"e":43,"an":null},{"s":"tone","n":"tone","w":true,"a":44,"e":48,"an":{"phonetic":"/təʊn/","pos":"n.","senseInContext":"语气、基调（set the wrong tone 定错了调子）","collocations":["set the tone","tone of voice","in a ... tone"],"examples":["Her tone suggested she was annoyed. 她的语气表明她有点恼火。"],"isCet4HighFreq":true,"more":{"roots":"ton（音调）→ 语气、色调","synonyms":"manner / mood / pitch","confusables":"tone 指语气/色调；tune 指曲调，别混"}}},{"s":".","n":null,"w":false,"a":48,"e":49,"an":null}],"an":{"translationLiteral":"它听起来自以为是，并且设定了错误的语气。","translationNatural":"这话听起来自以为是，也把气氛带偏了。","structMarkup":"【It】 _sounds_ ~self-righteous~ and _sets_ ~the wrong tone~.","structureSummary":"并列谓语：主语 + 系动词 + 表语，and + 谓语 + 宾语","components":[{"part":"It","role":"主语","note":"指上一句说的“我很忙”这句话"},{"part":"sounds","role":"系动词","note":"感官动词作系动词，后接形容词"},{"part":"self-righteous","role":"表语","note":"形容词“自以为是的、自以为正确的”"},{"part":"sets","role":"谓语","note":"与 sounds 并列的第二个谓语"},{"part":"the wrong tone","role":"宾语","note":"set the tone 意为“定调”"}],"clauses":["本句是简单句，没有从句；and 连接两个并列谓语，共用主语 It。","sounds 是系动词，所以后面接形容词 self-righteous 而不是副词。"],"phrases":[{"text":"sound + 形容词","meaning":"听起来……","usage":"sound / taste / smell / feel / look 都可作系动词，后接形容词。","example":"That sounds great. 听起来不错。"},{"text":"set the tone","meaning":"定调、奠定基调","usage":"常用搭配：set the tone for sth.（为某事定调）。","example":"The first meeting sets the tone for the project. 第一次会议为项目定下基调。"}],"pitfalls":["sound 作系动词时接形容词，不能说 sounds self-righteously。","self-righteous 带连字符，意思是“自认为永远正确的”，比 confident 带贬义。","sets 的主语仍是 It，不要误以为换了主语。"],"paragraphRole":"给出作者不再说“忙”的第一条理由：这话在道德姿态和语气上都不得体。"}},{"idx":2,"text":"Phrases like \"I have limited access to email\" and \"I'll respond as soon as I get back\" sound like you're being held against your will from working as opposed to making the most of your time off.","tokens":[{"s":"Phrases","n":"phrases","w":true,"a":0,"e":7,"an":null},{"s":"like","n":"like","w":true,"a":8,"e":12,"an":null},{"s":"\"","n":null,"w":false,"a":13,"e":14,"an":null},{"s":"I","n":"i","w":true,"a":14,"e":15,"an":null},{"s":"have","n":"have","w":true,"a":16,"e":20,"an":null},{"s":"limited","n":"limited","w":true,"a":21,"e":28,"an":null},{"s":"access","n":"access","w":true,"a":29,"e":35,"an":{"phonetic":"/ˈækses/","pos":"n.","senseInContext":"接触、使用的机会（limited access to email 不太方便查邮件）","collocations":["have access to","gain access to","internet access"],"examples":["Everyone has access to the online library. 每个人都能使用在线图书馆。"],"isCet4HighFreq":true,"more":{"roots":"ac-（向）+ cess（走）→ 走近 → 接近、通道","synonyms":"entry / availability","confusables":"access 是不可数名词，不能说 an example":"Students have free access to the library. 学生可以免费使用图书馆。"},{"text":"as soon as","meaning":"一……就……","usage":"引导时间状语从句，主句常用将来时，从句用一般现在时表将来。","example":"I'll call you as soon as I arrive. 我一到就给你打电话。"},{"text":"against one's will","meaning":"违背某人的意愿","usage":"固定搭配；will 在此是名词“意愿”，不是助动词。","example":"He signed the paper against his will. 他违背意愿签了那份文件。"},{"text":"as opposed to","meaning":"而不是、与……相对","usage":"用于对比两种说法或做法，后接名词/动名词。","example":"We should listen, as opposed to arguing. 我们该倾听，而不是争辩。"},{"text":"make the most of","meaning":"充分利用","usage":"the most of 后接名词；同义 make full use of。","example":"Make the most of your summer break. 好好利用你的暑假。"}],"pitfalls":["sound like 后面可以直接跟从句（口语），不要写成 sound as。","as opposed to 意为“而不是”，容易误读成“反对”。","being held 是进行时被动；漏掉 being 就变成一般现在时被动，时间感不同。","against one's will 中的 will 是名词“意愿”，别当成将来时的 will。"],"paragraphRole":"用三个具体说法作例子，说明“措辞”如何暴露我们对工作的真实态度——像是被迫，而不是享受假期。"}}]},{"idx":4,"sentences":[{"idx":0,"text":"That's why we recently launched the Out of Office Email Generator, a free tool you can use before your next long weekend or trip.","tokens":[{"s":"That's","n":"that's","w":true,"a":0,"e":6,"an":null},{"s":"why","n":"why","w":true,"a":7,"e":10,"an":null},{"s":"we","n":"we","w":true,"a":11,"e":13,"an":null},{"s":"recently","n":"recently","w":true,"a":14,"e":22,"an":null},{"s":"launched","n":"launched","w":true,"a":23,"e":31,"an":null},{"s":"the","n":"the","w":true,"a":32,"e":35,"an":null},{"s":"Out","n":"out","w":true,"a":36,"e":39,"an":null},{"s":"of","n":"of","w":true,"a":40,"e":42,"an":null},{"s":"Office","n":"office","w":true,"a":43,"e":49,"an":null},{"s":"Email","n":"email","w":true,"a":50,"e":55,"an":null},{"s":"Generator","n":"generator","w":true,"a":56,"e":65,"an":null},{"s":",","n":null,"w":false,"a":65,"e":66,"an":null},{"s":"a","n":"a","w":true,"a":67,"e":68,"an":null},{"s":"free","n":"free","w":true,"a":69,"e":73,"an":null},{"s":"tool","n":"tool","w":true,"a":74,"e":78,"an":null},{"s":"you","n":"you","w":true,"a":79,"e":82,"a function renderSent(s){
  let out='', cur=0;
  (s.tokens||[]).forEach((t,i)=>{
    if(t.a>cur) out+=escapeHtml(s.text.slice(cur,t.a));
    if(t.w) out+=`<span class="w${t.an?' has-an':''}" data-w="${i}">${escapeHtml(t.s)}</span>`;
    else if(/^\d+$/.test(t.s)) out+=`<span class="blank" data-no="${t.s}">${escapeHtml(t.s)}</span>`;
    else out+=escapeHtml(t.s);
    cur=t.e;
  });
  if(cur<s.text.length) out+=escapeHtml(s.text.slice(cur));
  return out;
}
function escapeHtml(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function emptyCard(){
  return `<div class="ac-empty"><h5>点句子开始精读</h5><ul>
    <li><b>句子</b>六段式解析：翻译 / 成分 / 从句 / 短语 / 易错 / 段作用</li>
    <li><b>单词</b>本句语境义，可加入生词本、可写笔记</li>
    <li><b>编号空格</b>正确答案与逐条排除</li></ul></div>`;
}
function analysisHtml(s){
  if(!s.an) return `<div class="ac-empty">该篇暂无预置解析<br><span>导入材料只保留笔记入口</span></div>`;
  const a=s.an;
  const li=(arr)=>arr.map(x=>`<li>${escapeHtml(x)}</li>`).join('');
  return `
  <div class="ac-head">
    <div class="ac-kicker">句 ${s.idx+1} · 解析</div>
    <p class="ac-quote">${escapeHtml(s.text)}</p>
  </div>
  <section class="ac-sec"><h4>① 翻译</h4><p class="lit">${escapeHtml(a.translationLiteral)}</p><p class="nat">${escapeHtml(a.translationNatural)}</p></section>
  <section class="ac-sec"><h4>② 主干与成分</h4><div class="mk-line">${markup(a.structMarkup)}</div><p class="sum">${escapeHtml(a.structureSummary)}</p>
    <ul class="legend"><li><span class="mk subj">主语</span></li><li><span class="mk pred">谓语</span></li><li><span class="mk obj">宾语/表语</span></li><li><span class="mk clause">{从句}</span></li><li><span class="mk phrase">(短语)</span></li></ul>
  </section>
  <section class="ac-sec"><h4>③ 从句与语法点</h4><ul>${li(a.clauses)}</ul></section>
  <section class="ac-sec"><h4>④ 重点短语</h4><ul class="phr">${a.phrases.map(p=>{const t=typeof p==='string'?p:p.text;const m=typeof p==='string'?'':p.meaning;const u=typeof p==='string'?'':p.usage;return `<li><b>${escapeHtml(t)}</b><span>${escapeHtml(m)}</span>${u?`<em>${escapeHtml(u)}</em>`:''}</li>`}).join('')}</ul></section>
  <section class="ac-sec"><h4>⑤ 易错点</h4><ul class="pit">${li(a.pitfalls)}</ul></section>
  <section class="ac-sec"><h4>⑥ 本句在段落中的作用</h4><p>${escapeHtml(a.paragraphRole)}</p></section>`;
}
function markup(src){
  const stack=[{type:'root',buf:'',gl:''}];
  const flush=(n)=>`<span class="mk ${n.type}">${escapeHtml(n.gl)}${n.buf}${{clause:'}',phrase:')'}[n.type]||''}</span>`;
  const closeTop=()=>{const n=stack.pop();stack[stack.length-1].buf+=flush(n)};
  for(const ch of src){
    const top=stack[stack.length-1];
    if(ch==='【')stack.push({type:'subj',buf:'',gl:''});
    else if(ch==='】'){if(stack.some(n=>n.type==='subj')){while(stack[stack.length-1].type!=='subj')closeTop();closeTop()}else top.buf+=escapeHtml(ch)}
    else if(ch==='{')stack.push({type:'clause',buf:'',gl:'{'});
    else if(ch==='}'){if(stack.some(n=>n.type==='clause')){while(stack[stack.length-1].type!=='clause')closeTop();closeTop()}else top.buf+=escapeHtml(ch)}
    else if(ch==='(')stack.push({type:'phrase',buf:'',gl:'('});
    else if(ch===')'){if(stack.some(n=>n.type==='phrase')){while(stack[stack.length-1].type!=='phrase')closeTop();closeTop()}else top.buf+=escapeHtml(ch)}
    else if(ch==='_'){if(top.type==='pred')closeTop();else stack.push({type:'pred',buf:'',gl:''})}
    else if(ch==='~'){if(top.type==='obj')closeTop();else stack.push({type:'obj',buf:'',gl:''})}
    else top.buf+=escapeHtml(ch);
  }
  while(stack.length>1)closeTop();
  return stack[0].buf;
}
function wordHtml(w){
  return `
  <div class="ac-head">
    <div class="ac-kicker">词卡</div>
    <div class="wc-word">${escapeHtml(w.surface)}<span class="wc-ph">${escapeHtml(w.phonetic)}</span><span class="wc-pos">${escapeHtml(w.pos)}</span></div>
    <p class="ac-quote" style="font-size:12.5px;margin:12px 0 10px">…${escapeHtml(w.sentence.slice(0, Math.max(0, w.sentence.toLowerCase().indexOf(w.surface.toLowerCase()) - 30)))}<b style="color:var(--accent)">${escapeHtml(w.surface)}</b>${escapeHtml(w.sentence.slice(Math.max(0, w.sentence.toLowerCase().indexOf(w.surface.toLowerCase())) + w.surface.length, Math.max(0, w.sentence.toLowerCase().indexOf(w.surface.toLowerCase())) + w.surface.length + 34))}…</p>
    <p class="wc-src">本句中的意思（语境义）</p>
    <p class="wc-sense">${escapeHtml(w.senseInContext)}</p>
  </div>
  <section class="ac-sec"><h4>搭配</h4><p>${(Array.isArray(w.collocations)?w.collocations:[w.collocations]).map(x=>`<code>${escapeHtml(x)}</code>`).join(' ')}</p></section>
  <section class="ac-sec"><h4>例句</h4><p>${(Array.isArray(w.examples)?w.examples:[w.examples]).map(x=>escapeHtml(x).replace(/s(?=[一-龥])/g,'<br>')).join('<br>')}</p></section>
  <section class="ac-sec"><h4>词义（通用）</h4><p class="muted">${w.lex?escapeHtml(w.lex.sense):'暂无预置词条'}</p></section>
  <section class="ac-sec"><h4>更多</h4><details><summary>词根 / 近义 / 易混</summary>
    <p>${escapeHtml(w.more?.roots||'—')}</p>
    <p class="muted">近义：${(Array.isArray(w.more?.synonyms)?w.more.synonyms:[w.more?.synonyms||'—']).join('、')}</p>
    <p class="muted">易混：${(Array.isArray(w.more?.confusables)?w.more.confusables:[w.more?.confusables||'—']).join('；')}</p>
  </details></section>
  <div class="wc-actions"><button class="btn primary" id="addVocab">加入生词本</button><button class="btn">写笔记</button></div>`;
}

// ---------- 路由 ----------
function route(){
  const h = (location.hash || '#/today').replace(/^#\//,'').split('?')[0] || 'today';
  const name = h === 'article' ? 'article' : (views[h] ? h : 'today');
  document.getElementById('main').innerHTML = views[name]();
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on', n.dataset.nav===name));
  window.scrollTo(0,0);
  bind();
}
function bind(){
  const main = document.getElementById('main');
  // 点句
  main.querySelectorAll('.s').forEach(el=>{
    el.addEventListener('click',(e)=>{
      if(e.target.classList.contains('w')||e.target.classList.contains('blank'))return;
      main.querySelectorAll('.s.cur').forEach(x=>x.classList.remove('cur'));
      el.classList.add('cur');
      main.querySelectorAll('.w.sel').forEach(x=>x.classList.remove('sel'));
      const p=+el.dataset.p, s=+el.dataset.s;
      const sent=DATA.article.paragraphs[p].sentences[s];
      const ac=document.getElementById('ac');
      if(ac){ac.innerHTML=analysisHtml(sent); document.getElementById('aside')?.classList.add('open');}
    });
  });
  // 点词
  main.querySelectorAll('.w').forEach(el=>{
    el.addEventListener('click',(e)=>{
      e.stopPropagation();
      const ac=document.getElementById('ac');
      main.querySelectorAll('.w.sel').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
      if(ac&&DATA.word){ac.innerHTML=wordHtml(DATA.word); document.getElementById('aside')?.classList.add('open');}
    });
  });
  // 点空
  main.querySelectorAll('.blank').forEach(el=>{
    el.addEventListener('click',(e)=>{
      e.stopPropagation();
      const no=el.dataset.no;
      const ac=document.getElementById('ac');
      if(ac){ac.innerHTML=`
        <div class="ac-head"><div class="ac-kicker">第 ${no} 空</div><p class="ac-quote">正确答案：impact（F）</p></div>
        <section class="ac-sec"><h4>为什么是它</h4><p>空格前有 a meaningful 修饰、后面接 on health，需要一个能与 on 搭配的名词。</p></section>
        <section class="ac-sec"><h4>易错与排除</h4><ul class="pit"><li>A adjust（动词，调整）语义不合</li><li>L risk（风险）语义不合</li><li>H moderate（形容词）词性不合</li></ul></section>
        <div class="wc-actions"><button class="btn primary">写笔记</button></div>`; document.getElementById('aside')?.classList.add('open');}
    });
  });
  // 显示答案
  main.querySelectorAll('[data-reveal]').forEach(el=>{
    el.addEventListener('click',()=>{const a=el.closest('.q').querySelector('.q-ans'); if(a)a.hidden=false; el.textContent='已显示答案';});
  });
  // 加入生词本
  const add=document.getElementById('addVocab');
  if(add) add.addEventListener('click',()=>{add.textContent='已加入';add.classList.add('done');});
  // 主题分段
  main.querySelectorAll('#themeseg button').forEach(b=>{
    b.addEventListener('click',()=>{setTheme(b.dataset.t); main.querySelectorAll('#themeseg button').forEach(x=>x.classList.toggle('on',x===b));});
  });
  // 侧栏主题按钮
  document.querySelectorAll('.theme-btn').forEach(b=>{
    b.addEventListener('click',()=>{setTheme(b.dataset.theme); document.querySelectorAll('.theme-btn').forEach(x=>x.classList.toggle('on',x===b));});
  });
  // Tab 切换（仅视觉）
  main.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    main.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  }));
}

// ---------- 主题 ----------
function applyTheme(t){
  const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const real = t==='system' ? (sysDark?'dark':'light') : t;
  document.documentElement.dataset.theme = real;
}
function setTheme(t){ localStorage.setItem('judou-theme',t); applyTheme(t); }
applyTheme(localStorage.getItem('judou-theme')||'system');
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyTheme(localStorage.getItem('judou-theme')||'system'));

window.addEventListener('hashchange', route);
const QP = new URLSearchParams(location.search);
if (QP.get('view') && !location.hash) location.hash = '#/' + QP.get('view');
if (QP.get('theme')) applyTheme(QP.get('theme'));
route();
// 截图/演示用：?pick=段-句 自动选中该句，?pickword=1 选中首个带解析的词
// 延后一拍执行：设置 location.hash 会异步触发 hashchange → route() 重渲染，需等它完成
setTimeout(() => {
  const PICK = QP.get('pick');
  if (PICK) {
    const [pp, ss] = PICK.split('-').map(Number);
    const el = document.querySelector(`.s[data-p="${pp}"][data-s="${ss}"]`);
    if (el) el.click();
  }
  if (QP.get('pickword')) {
    const w = document.querySelector('.w.has-an') || document.querySelector('.w');
    if (w) w.click();
  }
}, 120);
