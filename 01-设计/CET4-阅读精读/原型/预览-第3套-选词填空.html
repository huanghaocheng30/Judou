<!doctype html>

<title>第3套 · 选词填空 · 四级精读预览</title>
<style>
  :root{
    --bg:#faf8f3; --ink:#1f1d1a; --muted:#8a8175; --line:#e6e0d4;
    --accent:#c2410c; --accent-soft:#fbe9df;
    --sb:#1d4ed8; --pred:#b45309; --obj:#047857; --cl:#7c3aed; --pp:#6b7280;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:640px;margin:0 auto;min-height:100vh;background:var(--bg)}
  header{position:sticky;top:0;z-index:20;background:rgba(250,248,243,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
  header .t{flex:1;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .badge{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:6px 16px 0}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  article{padding:14px 16px 120px}
  p.para{margin:0 0 16px;font-family:Georgia,"Times New Roman",serif;font-size:17.5px;line-height:1.85;letter-spacing:.1px}
  .w{cursor:pointer;border-radius:3px;transition:background .12s}
  .w:active{background:var(--accent-soft)}
  .w.saved{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:1.5px;text-underline-offset:3px}
  .w.saved::after{content:"•";color:var(--accent);font-size:.8em;margin-left:1px}
  .an{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:2px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:10px;border-radius:5px;cursor:pointer;vertical-align:1px;font-family:inherit;padding:0}
  .an:active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .blank{display:inline-block;min-width:46px;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700;text-align:center;cursor:pointer;padding:0 5px;border-radius:3px;font-family:Georgia,serif;line-height:1.3}
  .blank:active{background:var(--accent-soft)}
  /* 笔记标记：写过笔记的词 = 荧光黄底；写过笔记的句子 = 「析」变橙并带小点 */
  .w.noted{background:#fff3c4;box-shadow:inset 0 -2px 0 #f0d97a;border-radius:3px}
  .an.has-note{background:var(--accent);color:#fff;border-color:var(--accent);position:relative}
  .an.has-note::after{content:"";position:absolute;top:-3px;right:-3px;width:6px;height:6px;border-radius:50%;background:#e11d48;border:1px solid #fff}
  .gone{color:transparent!important;text-decoration:none!important}
  section.q{border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
  section.q h3{margin:0;font-size:15px;color:var(--accent);font-weight:700;display:flex;justify-content:space-between;cursor:pointer;background:var(--accent-soft);border-radius:9px;padding:10px 12px}
  .qbody{display:none;margin-top:12px}
  .qbody.open{display:block}
  .qitem{margin-bottom:16px;font-size:14.5px}
  .qitem .stem{font-family:Georgia,serif;margin-bottom:6px}
  .opt{color:var(--muted);padding:3px 0 3px 2px;cursor:not-allowed;user-select:none}
  .ans{display:inline-block;font-size:12px;color:#fff;background:var(--accent);border-radius:5px;padding:1px 7px;margin-left:6px;opacity:0}
  .ans.show{opacity:1}
  .ansbtn{margin:8px 0 0;font-size:12.5px;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:7px;padding:5px 12px;cursor:pointer}
  .sheet-mask{position:fixed;inset:0;background:rgba(20,18,15,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .sheet-mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:55vh;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.16);transform:translateY(102%);transition:transform .24s cubic-bezier(.22,.8,.3,1);display:flex;flex-direction:column}
  .sheet.on{transform:translateY(0)}
  .sheet .grab{width:36px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 2px;flex:0 0 auto}
  .sheet .head{padding:2px 18px 10px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
  .sheet .head .hw{font-size:19px;font-weight:700;font-family:Georgia,serif}
  .sheet .head .ph{font-size:12.5px;color:var(--muted)}
  .sheet .head .pos{font-size:12px;color:var(--accent);border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:5px;padding:1px 6px}
  .sheet .close{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;border:none;background:#f1ece2;color:#6b6357;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
  .sheet .close:active{background:var(--accent-soft);color:var(--accent)}
  header .qjump{font-size:12px;color:var(--accent);border:1px solid var(--accent);background:#fff;border-radius:99px;padding:4px 11px;cursor:pointer;white-space:nowrap;font-family:inherit}
  header .qjump:active{background:var(--accent-soft)}
  .sheet .body{overflow-y:auto;padding:12px 18px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .sec{margin-bottom:14px}
  .sec .sec-t{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.4px;margin-bottom:5px}
  .sense{font-size:17px;font-weight:600;line-height:1.5}
  .tr{font-size:14.5px;line-height:1.75;margin:2px 0}
  .tr b{color:var(--muted);font-weight:600;font-size:12px;margin-right:5px}
  .markup{font-family:Georgia,serif;font-size:16px;line-height:2.1;background:#fbfaf7;border:1px solid var(--line);border-radius:9px;padding:10px 12px;word-break:break-word}
  .markup .sb{color:var(--sb);font-weight:700}
  .markup .pred{color:var(--pred);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
  .markup .obj{color:var(--obj);text-decoration:underline wavy;text-decoration-thickness:1px;text-underline-offset:4px}
  .markup .cl{color:var(--cl)}
  .markup .pp{color:var(--pp);font-size:.94em}
  ul.plain{margin:4px 0 0;padding-left:18px;font-size:14px;line-height:1.7}
  ul.plain li{margin-bottom:4px}
  .fold{border:1px solid var(--line);border-radius:9px;margin-bottom:9px;overflow:hidden}
  .fold .fh{padding:9px 12px;font-size:13.5px;font-weight:600;background:#fbfaf7;cursor:pointer;display:flex;justify-content:space-between}
  .fold .fh span{color:var(--muted);font-weight:400;font-size:12px}
  .fold .fc{display:none;padding:4px 12px 12px;font-size:14px;line-height:1.75}
  .fold.open .fc{display:block}
  .ph-card{border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:8px;font-size:14px}
  .ph-card .pt{font-family:Georgia,serif;font-weight:700;color:var(--accent)}
  .ph-card .pm{margin-top:3px}
  .ph-card .pu,.ph-card .pe{color:var(--muted);font-size:13px;margin-top:2px}
  .btn{width:100%;padding:11px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.ghost{background:#fff;color:var(--accent)}
  textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:14px/1.6 inherit;resize:vertical;background:#fff}
  .note-tip{font-size:11.5px;color:var(--muted);margin-top:4px}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:22px 0}
  .toast{position:fixed;left:50%;bottom:calc(58vh + 12px);transform:translateX(-50%);background:#1f1d1a;color:#fff;font-size:12.5px;padding:7px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
  .toast.on{opacity:1}
  .morebtn{margin-top:6px;font-size:12.5px;color:var(--accent);background:none;border:none;padding:2px 0;cursor:pointer;font-family:inherit}
  /* —— 桌面端：右侧固定栏 —— */
  @media (min-width:900px){
    body{transition:padding .22s ease}
    .wrap{max-width:680px;margin:0 auto}
    body.has-side{padding-right:420px}
    .sheet{left:auto;right:0;top:0;bottom:0;width:420px;max-height:none;border-radius:0;transform:translateX(100%);box-shadow:-10px 0 40px rgba(0,0,0,.10)}
    .sheet.on{transform:none}
    .sheet .grab{display:none}
    .sheet .head{padding-top:18px}
    .sheet-mask{display:none!important}
    .toast{bottom:auto;top:24px}
  }
</style>
</head>

const saved = JSON.parse(localStorage.getItem('juedou.saved') || '[]');
const notes = JSON.parse(localStorage.getItem('juedou.notes') || '{}');

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// 词卡 more.* / 空号 distractors：既可能是字符串，也可能是数组（清单），统一安全渲染
const escV = v => Array.isArray(v) ? v.map(x => esc(String(x))).join('<br>') : esc(String(v ?? ''));
const save = () => localStorage.setItem('juedou.saved', JSON.stringify([...new Set(saved)]));

function renderMarkup(s){
  let out = esc(s);
  out = out.replace(/【([^】]*)】/g, '<span class="sb">$1</span>');
  out = out.replace(/_([^_]+)_/g, '<span class="pred">$1</span>');
  out = out.replace(/~([^~]+)~/g, '<span class="obj">$1</span>');
  out = out.replace(/\{([^}]*)\}/g, '<span class="cl">{$1}</span>');
  out = out.replace(/\(([^)]*)\)/g, '<span class="pp">($1)</span>');
  return out;
}

// 正文
const art = document.getElementById('article');
for (const p of PACK.paragraphs){
  const el = document.createElement('p'); el.className = 'para';
  for (const s of p.sentences){
    const sent = document.createElement('span');
    let cursor = 0;
    for (const t of s.tokens){
      if (t.start > cursor) sent.appendChild(document.createTextNode(s.text.slice(cursor, t.start)));
      if (t.isWord){
        const w = document.createElement('span');
        w.className = 'w' + (saved.includes(t.normalized) ? ' saved' : '') + (notes['w:' + p.idx + ':' + s.idx + ':' + t.start] ? ' noted' : '');
        w.textContent = t.surface;
        w.dataset.n = t.normalized;
        w.dataset.p = p.idx; w.dataset.s = s.idx;
        w.dataset.k = p.idx + ':' + s.idx + ':' + t.start;
        w.onclick = e => { e.stopPropagation(); openWord(p.idx, s.idx, t); };
        sent.appendChild(w);
      } else if (t.isBlank){
        const b = document.createElement('span');
        b.className = 'blank';
        b.textContent = t.blankNo;
        b.onclick = e => { e.stopPropagation(); openBlank(t.blankNo); };
        sent.appendChild(b);
      } else {
        sent.appendChild(document.createTextNode(t.surface));
      }
      cursor = t.end;
    }
    if (cursor < s.text.length) sent.appendChild(document.createTextNode(s.text.slice(cursor)));
    if (s.analysis){
      const b = document.createElement('button');
      b.className = 'an' + (notes['s:' + p.idx + ':' + s.idx] ? ' has-note' : '');
      b.textContent = '析';
      b.dataset.p = p.idx; b.dataset.s = s.idx;
      b.onclick = e => { e.stopPropagation(); openSentence(p.idx, s.idx); };
      sent.appendChild(b);
    }
    el.appendChild(sent);
    el.appendChild(document.createTextNode(' '));
  }
  art.appendChild(el);
}

// 题目
const qbody = document.getElementById('qbody');
for (const q of PACK.questions){
  const d = document.createElement('div'); d.className = 'qitem';
  let h = '<div class="stem">' + q.no + '. ' + esc(q.stem) + '<span class="ans" id="ans' + q.no + '">答案 ' + (q.answer||'待补') + '</span></div>';
  for (const o of q.options) h += '<div class="opt">' + o.key + ') ' + esc(o.text) + '</div>';
  d.innerHTML = h; qbody.appendChild(d);
}
document.getElementById('qtoggle').onclick = () => {
  const b = document.getElementById('qbody'); b.classList.toggle('open');
  document.getElementById('qarrow').textContent = b.classList.contains('open') ? '收起 ▴' : '展开 ▾';
};
const ab = document.createElement('button');
ab.className = 'ansbtn'; ab.textContent = '显示答案';
ab.onclick = () => {
  const on = ab.textContent === '显示答案';
  PACK.questions.forEach(q => document.getElementById('ans'+q.no).classList.toggle('show', on));
  ab.textContent = on ? '隐藏答案' : '显示答案';

qbody.appendChild(ab);

// 抽屉
const sheet = document.getElementById('sheet'), mask = document.getElementById('mask');
const shead = document.getElementById('shead'), sbody = document.getElementById('sbody');
function closeSheet(){ sheet.classList.remove('on'); mask.classList.remove('on'); document.body.classList.remove('has-side'); }
mask.onclick = closeSheet;

function openSheet(){ mask.classList.add('on'); sheet.classList.add('on'); if(window.innerWidth>=900) document.body.classList.add('has-side'); }

function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1400);
}

let touchY = 0;
sheet.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, {passive:true});
sheet.addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - touchY;
  if (dy > 60 && sheet.querySelector('.body').scrollTop <= 0) closeSheet();
}, {passive:true});

function openBlank(no){
  const b = PACK.blanks && PACK.blanks[no];
  shead.innerHTML = '<div class="hw">第 ' + no + ' 空</div>' + (b ? '<span class="pos">' + esc(b.answerKey) + '</span>' : '');
  let h = '';
  if (b){
    h += '<div class="sec"><div class="sec-t">正确答案</div><div class="sense">' + esc(b.answerWord) + '　（词库 ' + esc(b.answerKey) + '）</div></div>';
    h += '<div class="sec"><div class="sec-t">为什么是它</div><div class="tr" style="font-size:14.5px">' + esc(b.reason) + '</div></div>';
    h += '<div class="sec"><div class="sec-t">易错与排除</div><div class="tr" style="font-size:14px;color:var(--muted)">' + escV(b.distractors) + '</div></div>';
  } else {
    h += '<div class="empty">该空暂无解析</div>';
  }
  sbody.innerHTML = h;
  sbody.scrollTop = 0;
  openSheet();
}

function findSentence(pIdx, sIdx){
  return PACK.paragraphs[pIdx].sentences[sIdx];
}

function openSentence(pIdx, sIdx){
  const s = findSentence(pIdx, sIdx), a = s.analysis;
  shead.innerHTML = '<div class="hw">整句解析</div><span class="ph">P' + (pIdx+1) + ' · 第' + (sIdx+1) + '句</span>';
  let h = '';
  h += '<div class="sec"><div class="sec-t">中文翻译</div>' +
       '<div class="tr"><b>直译</b>' + esc(a.translationLiteral) + '</div>' +
       '<div class="tr"><b>顺译</b>' + esc(a.translationNatural) + '</div></div>';
  h += '<div class="sec"><div class="sec-t">句子主干 / 成分划分</div>' +
       '<div class="markup">' + renderMarkup(a.structMarkup) + '</div>' +
       '<div class="tr" style="margin-top:8px"><b>主干</b>' + esc(a.structureSummary) + '</div>';
  for (const c of a.components){
    h += '<div class="tr" style="font-size:13.5px"><b style="color:var(--muted)">' + esc(c.role) + '</b>' +
         '<span style="font-family:Georgia,serif">' + esc(c.part) + '</span> — ' + esc(c.note) + '</div>';
  }
  h += '</div>';
  h += fold('从句和语法点', '<ul class="plain">' + a.clauses.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>', false);
  h += fold('重点短语 / 固定搭配', a.phrases.map(ph =>
      '<div class="ph-card"><div class="pt">' + esc(ph.text) + '</div>' +
      '<div class="pm"><b style="font-size:12px;color:var(--muted)">意思</b> ' + esc(ph.meaning) + '</div>' +
      '<div class="pu"><b>用法</b> ' + esc(ph.usage) + '</div>' +
      '<div class="pe"><b>例句</b> ' + esc(ph.example) + '</div></div>').join(''), false);
  h += fold('易错点 / 难点提醒', '<ul class="plain">' + a.pitfalls.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>', false);
  h += fold('本句在段落中的作用', '<div style="font-size:14px;line-height:1.75">' + esc(a.paragraphRole) + '</div>', false);

  const nk = 's:' + pIdx + ':' + sIdx;
  h += '<div class="sec" style="margin-top:14px"><div class="sec-t">我的笔记</div>' +
       '<textarea id="noteBox" placeholder="用自己的话记一句…">' + esc(notes[nk] || '') + '</textarea>' +
       '<div class="note-tip">停止输入 0.6 秒自动保存（预览版存浏览器本地）</div></div>';

  sbody.innerHTML = h;
  sbody.scrollTop = 0;
  bindFolds();
  bindNote(nk);
  openSheet();
  scrollIntoViewSafe(pIdx, sIdx);
}

function fold(title, inner, open){
  return '<div class="fold' + (open ? ' open' : '') + '"><div class="fh">' + title + '<span>' + (open?'收起':'展开') + '</span></div><div class="fc">' + inner + '</div></div>';
}

function bindFolds(){
  sbody.querySelectorAll('.fold .fh').forEach(h => {
    h.onclick = () => {
      const f = h.parentElement; f.classList.toggle('open');
      h.querySelector('span').textContent = f.classList.contains('open') ? '收起' : '展开';
    };
  });
}

let noteTimer = null;
function bindNote(key){
  const box = document.getElementById('noteBox');
  if (!box) return;
  box.oninput = () => {
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      notes[key] = box.value;
      localStorage.setItem('juedou.notes', JSON.stringify(notes));
      refreshNoteMarks();
      toast('笔记已保存');
    }, 600);
  };
}

// 笔记保存后立刻把标记刷到正文上，让用户当场看见“这句/这个词记过”
function refreshNoteMarks(){
  document.querySelectorAll('.w').forEach(w => {
    w.classList.toggle('noted', !!notes['w:' + w.dataset.k]);
  });
  document.querySelectorAll('article .an').forEach(b => {
    b.classList.toggle('has-note', !!notes['s:' + b.dataset.p + ':' + b.dataset.s]);
  });
}

function openWord(pIdx, sIdx, tok){
  const a = tok.analysis;
  const isSaved = saved.includes(tok.normalized);
  shead.innerHTML = '<div class="hw">' + esc(tok.surface) + '</div>' +
    (a ? '<span class="ph">' + esc(a.phonetic) + '</span><span class="pos">' + esc(a.pos) + '</span>' : '');
  let h = '';
  if (a){
    h += '<div class="sec"><div class="sec-t">本句中的意思</div><div class="sense">' + esc(a.senseInContext) + '</div></div>';
    if (a.collocations && a.collocations.length)
      h += '<div class="sec"><div class="sec-t">搭配</div>' + a.collocations.map(c => '<div class="tr">· ' + esc(c) + '</div>').join('') + '</div>';
    if (a.examples && a.examples.length)
      h += '<div class="sec"><div class="sec-t">例句</div>' + a.examples.map(e => '<div class="tr" style="font-family:Georgia,serif">' + esc(e) + '</div>').join('') + '</div>';
    if (a.more){
      h += '<button class="morebtn" id="moreBtn">更多：词根 / 近义 / 易混 ▾</button>';
      h += '<div id="moreBox" style="display:none" class="sec">' +
           (a.more.roots ? '<div class="tr"><b>词根</b>' + escV(a.more.roots) + '</div>' : '') +
           (a.more.synonyms ? '<div class="tr"><b>近义</b>' + escV(a.more.synonyms) + '</div>' : '') +
           (a.more.confusables ? '<div class="tr"><b>易混</b>' + escV(a.more.confusables) + '</div>' : '') +
           '</div>';
    }
  } else {
    h += '<div class="empty">本词暂无预置解析<br><span style="font-size:12px">仍可加入生词本，稍后补解析</span></div>';
  }
  h += '<button class="btn ' + (isSaved ? 'ghost' : '') + '" id="saveBtn">' + (isSaved ? '已收藏 ✓' : '加入生词本') + '</button>';
  const nk = 'w:' + pIdx + ':' + sIdx + ':' + tok.start;
  h += '<div class="sec" style="margin-top:14px"><div class="sec-t">我的笔记</div>' +
       '<textarea id="noteBox" placeholder="记一句你自己的理解…">' + esc(notes[nk] || '') + '</textarea></div>';
  sbody.innerHTML = h;
  sbody.scrollTop = 0;
  bindNote(nk);
  const mb = document.getElementById('moreBtn');
  if (mb) mb.onclick = () => {
    const box = document.getElementById('moreBox');
    const on = box.style.display === 'none';
    box.style.display = on ? 'block' : 'none';
    mb.textContent = on ? '收起 ▴' : '更多：词根 / 近义 / 易混 ▾';
  };
  const sb = document.getElementById('saveBtn');
  sb.onclick = () => {
    const i = saved.indexOf(tok.normalized);
    if (i >= 0) { saved.splice(i, 1); sb.textContent = '加入生词本'; sb.classList.remove('ghost'); toast('已移出生词本'); }
    else { saved.push(tok.normalized); sb.textContent = '已收藏 ✓'; sb.classList.add('ghost'); toast('已加入生词本'); }
    save();
    document.querySelectorAll('.w[data-n="' + tok.normalized + '"]').forEach(w =>
      w.classList.toggle('saved', saved.includes(tok.normalized)));
  };
  openSheet();
  scrollIntoViewSafe(pIdx, sIdx);
}

// 抽屉打开时把被点的句子滚到抽屉上沿以上（锚点保持）
function scrollIntoViewSafe(pIdx, sIdx){
  const el = document.querySelector('.w[data-p="' + pIdx + '"][data-s="' + sIdx + '"]');
  if (!el) return;
  const target = el.getBoundingClientRect().top + window.scrollY - window.innerHeight * 0.42;
  window.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
}

document.getElementById('back').onclick = () => closeSheet();
document.getElementById('closeBtn').onclick = closeSheet;
document.getElementById('qjump').onclick = () => {
  const b = document.getElementById('qbody');
  b.classList.add('open');
  document.getElementById('qarrow').textContent = '收起 ▴';
  document.querySelector('section.q').scrollIntoView({ behavior: 'smooth', block: 'start' });
};
</script>
</body>
