[package]
name = "judou"
version = "0.1.0"
description = "句读 · CET4/CET6 阅读精读工作台"
edition = "2021"
# 本 crate 有两个 bin（隐式 judou + 显式 import_user_cli）：不设 default-run 时
# `cargo run`（tauri dev/build 走它）无法选 bin，报 "could not determine which binary to run"。
default-run = "judou"

# 官方 Tauri v2 模板约定：包名 judou、lib 名 judou_lib（main.rs 调 judou_lib::run()）。
# 02 计划评审 R5：不加 [lib] name 时默认 lib 名是 judou，judou_lib::run() 会编译失败。
[lib]
name = "judou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled：随 crate 编译 SQLite C 源码，不依赖系统 sqlite3.lib（计划评审 R1）
rusqlite = { version = "0.32", features = ["bundled"] }
# sentence.text_hash = sha256(text) 前 16 位（02 D3）；标准实现，不自己写哈希
sha2 = "0.10"

# M5 D8 门禁契约（`scripts/verify-import-user.mjs` → `import_user_cli`）。
# 必须显式声明 bin：crate 有 lib target 时 cargo 不自动发现 src/bin/（2026-11-07 实测
# `no bin target named import_user_cli`）。只引用本 crate 的 lib，**不引入任何新 crate**。
[[bin]]
name = "import_user_cli"
path = "src/bin/import_user_cli.rs"

# M5b D6 门禁契约（`scripts/verify-ai-import.mjs` → `ai_import_cli`）。
# 只引用本 crate 的 lib（`judou_lib::ai_import`），**不引入任何新 crate**；
# 校验与 SQL 一律在 `ai_import.rs`，bin 内不复制（02 N4）。
[[bin]]
name = "ai_import_cli"
path = "src/bin/ai_import_cli.rs"
